<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="strokeGrad" x1="36" y1="44" x2="224" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7EF7F2"/>
      <stop offset="55%" stop-color="#7AA9FF"/>
      <stop offset="100%" stop-color="#E66BFF"/>
    </linearGradient>
    <radialGradient id="orbGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(116 108) rotate(45) scale(84)">
      <stop offset="0%" stop-color="#F4FFFF"/>
      <stop offset="35%" stop-color="#8FF3F1"/>
      <stop offset="70%" stop-color="#8AB8FF"/>
      <stop offset="100%" stop-color="#D975FF"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#softGlow)" stroke="url(#strokeGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer hexagon -->
    <path d="M128 26 212 76.5V179.5L128 230 44 179.5V76.5L128 26Z" stroke-width="14"/>

    <!-- inner crossed geometry -->
    <path d="M128 26 74 128 128 230" stroke-width="12"/>
    <path d="M128 26 182 128 128 230" stroke-width="12"/>
    <path d="M44 76.5 74 128 44 179.5" stroke-width="12"/>
    <path d="M212 76.5 182 128 212 179.5" stroke-width="12"/>

    <path d="M44 76.5 128 230" stroke-width="12"/>
    <path d="M44 179.5 128 26" stroke-width="12"/>
    <path d="M212 76.5 128 230" stroke-width="12"/>
    <path d="M212 179.5 128 26" stroke-width="12"/>

    <!-- orbit arcs -->
    <path d="M92 92A46 31 0 0 1 164 92" stroke-width="10"/>
    <path d="M92 164A46 31 0 0 0 164 164" stroke-width="10"/>
  </g>

  <!-- center orb -->
  <circle cx="128" cy="128" r="28" fill="url(#orbGrad)"/>
</svg>
